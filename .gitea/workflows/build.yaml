name: build-image

on:
  push:
    branches: [main]
    paths: ['app/**', 'Dockerfile', 'requirements.txt']

jobs:
  build:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: 192.168.1.2:3000
          username: reeds
          password: ${{ secrets.REGISTRY_PUSH_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 192.168.1.2:3000/reeds/streamplay-service:latest
